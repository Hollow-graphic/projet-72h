<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — Médiathèque</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='static/style.css') }}">
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <div class="header__brand">
        <span class="header__icon material-symbols-outlined">admin_panel_settings</span>
        <h1 class="header__title">Administration</h1>
      </div>
      <button class="btn btn--accent" id="submitBtn">
        <span class="material-symbols-outlined">download</span>
        submit
      </button>
      <button class="btn btn--ghost" id="loginBtn">
        <span class="material-symbols-outlined">person</span>
        Connexion
      </button>
    </div>
  </header>
  <main class="main">

    <section class="admin-card">
      <h2 class="admin-card__title">
        <span class="material-symbols-outlined">search</span>
        Rechercher un ouvrage
      </h2>

      <div class="search-bar">
        <span class="search-bar__icon material-symbols-outlined">book</span>
        <input
          type="text"
          class="search-bar__input"
          id="nameInput"
          placeholder="Nom ou ID du livre"
          autocomplete="off"
        >
        <button class="btn btn--accent" id="sendBtn">Chercher</button>
        <button class="btn btn--accent" id="adminBtn">
          Confirmer un retour
        </button>
      </div>

      <p class="server-reply" id="serverReply"></p>
    </section>

    <section class="filter-section" id="labelContainer" aria-label="Résultats"></section>

  </main>

  <script src="{{ url_for('static', filename='static/script.js') }}"></script>
</body>
</html>
